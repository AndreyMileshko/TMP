spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/tmp_dev
    username: tmp
    password: tmp
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: tmp-dev-pool
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

tmp:
  security:
    bootstrap:
      # Credentials must come from TMP_SECURITY_BOOTSTRAP_* environment variables.
      # No repository defaults — empty DB without configuration fails fast at startup.
  production:
    warehouse:
      # Required when Production Capability is on the classpath. Set to real Warehouse IDs
      # created for the environment (main stock + production floor). Example placeholders:
      # main-warehouse-id: 11111111-1111-4111-8111-111111111111
      # production-warehouse-id: 22222222-2222-4222-8222-222222222222

logging:
  level:
    com.tmp: DEBUG
